services:
  # ─── App database ────────────────────────────────────────────────────────────
  # Primary PostgreSQL instance for oh-writers application data.
  # Runs on the standard port 5432 — the app DATABASE_URL points here.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oh-writers
      POSTGRES_PASSWORD: oh-writers
      POSTGRES_DB: oh-writers_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oh-writers -d oh-writers_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── App cache / pub-sub ─────────────────────────────────────────────────────
  # Redis used by the app for session caching and future pub-sub (multi-tab
  # Cesare streaming). Port 6379 is the standard Redis port.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
