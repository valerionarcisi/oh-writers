# fly.toml app configuration file generated for oh-writers-web-beta on 2026-09-04T12:43:12+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oh-writers-web-beta'
primary_region = 'fra'

[build]
  dockerfile = 'docker/Dockerfile.web'

  [build.args]
    VITE_WS_URL = 'wss://ws-beta.ohwriters.com'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
