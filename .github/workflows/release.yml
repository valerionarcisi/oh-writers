name: Release

on:
  push:
    branches: [main, beta]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # semantic-release pushes a version-bump commit tagged "[skip ci]" — this
    # guard stops that commit from re-triggering the QA/deploy workflows.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The default GITHUB_TOKEN can never push to a protected branch, no
      # matter the `permissions:` block above — that's a GitHub-side limit,
      # not something workflow permissions can override. RELEASE_TOKEN is a
      # fine-grained PAT (repo-scoped, Contents/Issues/PRs read-write) that
      # can, since it authenticates as the repo owner rather than the bot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # The bump commit's git push would otherwise run .husky/pre-push
          # (typecheck/lint/unit/build) inside this minimal runner, which
          # has no @oh-writers/db build step — failing with "Failed to
          # resolve entry for package @oh-writers/db". Redundant anyway:
          # qa.yml already gated everything on this commit before merge.
          HUSKY: "0"
      # deploy.yml used to listen for this workflow via `workflow_run`, but
      # that trigger only fires for runs whose workflow file is on the
      # default branch (main) — so it silently never fired for beta releases.
      # Deploying directly from here, in the same job/branch context, has no
      # such ambiguity. `git rev-parse HEAD` after semantic-release tells us
      # whether it actually pushed a release commit (it no-ops on a branch
      # with nothing releasable).
      - name: Check whether a release was cut
        id: released
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "did_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "did_release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.released.outputs.did_release == 'true'
      - name: Deploy web (production)
        if: steps.released.outputs.did_release == 'true' && github.ref_name == 'main'
        run: flyctl deploy --config fly.web.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy ws-server (production)
        if: steps.released.outputs.did_release == 'true' && github.ref_name == 'main'
        run: flyctl deploy --config fly.ws-server.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy web (beta)
        if: steps.released.outputs.did_release == 'true' && github.ref_name == 'beta'
        run: flyctl deploy --config fly.web.beta.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy ws-server (beta)
        if: steps.released.outputs.did_release == 'true' && github.ref_name == 'beta'
        run: flyctl deploy --config fly.ws-server.beta.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
