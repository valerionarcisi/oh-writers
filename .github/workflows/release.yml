name: Release

on:
  push:
    branches: [main, beta]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # semantic-release pushes a version-bump commit tagged "[skip ci]" — this
    # guard stops that commit from re-triggering the QA/deploy workflows.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The default GITHUB_TOKEN can never push to a protected branch, no
      # matter the `permissions:` block above — that's a GitHub-side limit,
      # not something workflow permissions can override. RELEASE_TOKEN is a
      # fine-grained PAT (repo-scoped, Contents/Issues/PRs read-write) that
      # can, since it authenticates as the repo owner rather than the bot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
