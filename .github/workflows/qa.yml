name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  e2e-mock:
    name: E2E (Mock, Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oh-writers
          POSTGRES_PASSWORD: oh-writers
          POSTGRES_DB: oh-writers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://oh-writers:oh-writers@localhost:5432/oh-writers_test
      DATABASE_URL_TEST: postgresql://oh-writers:oh-writers@localhost:5432/oh-writers_test
      MOCK_AI: 'true'
      LLM_FIRST_BREAKDOWN: 'false'
      BETTER_AUTH_SECRET: ci-test-secret-min-32-chars-padding
      BETTER_AUTH_URL: http://localhost:3002
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (db needs its dist for runtime imports)
        run: pnpm --filter './packages/*' build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate test DB
        run: pnpm db:migrate
      - name: Seed test DB
        run: pnpm db:seed:reset
      - name: Mock E2E (Cesare agentic, --project=mock-ui)
        # `list` reporter prints each failing test name + assertion to stdout,
        # so the failure surfaces in the CI log even when the HTML artifact
        # cannot be downloaded.
        run: pnpm test:e2e --project=mock-ui --reporter=list
      - name: Dump failing-test details on failure
        if: failure()
        run: |
          set -e
          echo "=== playwright-report/index.html (first 2000 lines) ==="
          if [ -f playwright-report/index.html ]; then
            head -2000 playwright-report/index.html
          else
            echo "(no html report)"
          fi
          echo "=== test-results/ (if any) ==="
          ls -la test-results/ 2>/dev/null || echo "(no test-results)"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # Build must not require real API keys — server code reads them at runtime, not build time.
      MOCK_AI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
