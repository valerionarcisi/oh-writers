name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main, beta]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Checked out at the exact commit Release ran on, not just "latest on
      # the branch" — avoids deploying a different commit if another push
      # landed on beta/main while Release was still running.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy web (production)
        if: github.event.workflow_run.head_branch == 'main'
        run: flyctl deploy --config fly.web.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy ws-server (production)
        if: github.event.workflow_run.head_branch == 'main'
        run: flyctl deploy --config fly.ws-server.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy web (beta)
        if: github.event.workflow_run.head_branch == 'beta'
        run: flyctl deploy --config fly.web.beta.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy ws-server (beta)
        if: github.event.workflow_run.head_branch == 'beta'
        run: flyctl deploy --config fly.ws-server.beta.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
