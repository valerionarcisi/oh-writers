# Render Blueprint — maps the two working Docker targets onto Render's
# managed Postgres/Redis. Render doesn't read docker-compose.yml (each
# service is a first-class Blueprint entry instead), and Blueprint has no
# native --target selection for a shared multi-stage Dockerfile, so each
# service points at its own docker/Dockerfile.{web,ws-server} — see the
# comment atop those files. Render's preDeployCommand + built-in TLS
# replace the compose-based `migrate` service and Caddy step planned for
# a bare-VPS deploy.
databases:
  - name: oh-writers-db
    plan: basic-1gb
    databaseName: oh_writers
    user: oh_writers

# Shared between web and ws-server so `/internal/reseed-room` (web calling
# ws-server to evict a stale in-memory CRDT room after a Cesare/version-
# activate write) can authenticate — generateValue on each service
# individually would produce two different secrets, and fromService can't
# reference a custom generated var on another service (only built-in
# properties like host/port/connectionString), so an envVarGroup is the
# one Blueprint mechanism that shares a single generated value. See
# apps/web/app/features/realtime/server/notify-room-reseed.ts and
# apps/ws-server/src/index.ts.
envVarGroups:
  - name: oh-writers-ws-internal
    envVars:
      - key: WS_INTERNAL_SECRET
        generateValue: true

services:
  - name: oh-writers-redis
    type: keyvalue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - name: oh-writers-web
    type: web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.web
    dockerContext: .
    plan: starter
    healthCheckPath: /
    # The final web image has no pnpm workspace (see docker/Dockerfile.web) —
    # db-deploy/ is the standalone `pnpm deploy` of @oh-writers/db shipped
    # alongside it purely so this command has drizzle-kit to run.
    preDeployCommand: cd db-deploy && node_modules/.bin/drizzle-kit migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oh-writers-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: oh-writers-redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: WS_URL
        sync: false
      - fromGroup: oh-writers-ws-internal
      # Deliberately absent: ANTHROPIC_API_KEY. Features.AI_ENABLED
      # resolves to OFF without it — first deploy ships as a pure editor,
      # no AI surface, no Anthropic spend risk.

  - name: oh-writers-ws-server
    type: web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.ws-server
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oh-writers-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: oh-writers-redis
          property: connectionString
      - key: WS_PORT
        value: 1234
      - fromGroup: oh-writers-ws-internal
