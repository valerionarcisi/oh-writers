<!-- Maskable variant: Android crops icons to its own shape (circle, squircle,
     rounded square), so the mark sits inside the 80% safe zone and the
     background bleeds to the full canvas. Without this the "O" gets clipped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Oh Writers">
  <rect width="512" height="512" fill="#1c1a17"/>
  <text x="256" y="256" fill="#f5f3ee" font-family="Fraunces, Georgia, serif"
        font-size="230" font-weight="600" text-anchor="middle"
        dominant-baseline="central">O</text>
</svg>
