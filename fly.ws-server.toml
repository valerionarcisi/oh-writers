app = "oh-writers-ws-server"
primary_region = "fra"

[build]
  dockerfile = "docker/Dockerfile.ws-server"

[env]
  WS_PORT = "1234"

[http_service]
  internal_port = 1234
  force_https = true
  # ponytail: kept always-on (min=1) — WS connections are stateful/long-lived,
  # scale-to-zero would drop active realtime sessions on cold start. Web can
  # scale to zero freely because HTTP requests are stateless.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
